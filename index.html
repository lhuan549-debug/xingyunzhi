<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸运四叶草 - 点击收集</title>
    <style>
        :root {
            --clover-green: #4CAF50; /* 绿色 */
            --bg-dark: #121212;
            --text-gold: #FFD700;
        }
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg-dark);
            color: #eee;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            user-select: none;
            overflow: hidden;
        }
        
        /* 统计面板 */
        .stats-panel {
            margin-top: 50px;
            text-align: center;
            background: rgba(255,255,255,0.03);
            padding: 25px 20px;
            border-radius: 20px;
            width: 85%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .total-count { font-size: 1.1rem; color: #999; margin-bottom: 5px; }
        .today-count-label { color: #aaa; font-size: 1rem; }
        .today-count { font-size: 3.2rem; font-weight: bold; margin: 5px 0; color: var(--clover-green); text-shadow: 0 0 10px rgba(76,175,80,0.5); }
        
        /* 四叶草容器 */
        .clover-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
        }
        
        /* 四叶草图片 (使用 Unicode 字符) */
        #clover {
            font-size: 120px; /* 四叶草大小 */
            cursor: pointer;
            transition: transform 0.05s ease-out;
            /* 简单的呼吸灯效果 */
            animation: breathe 3s infinite ease-in-out;
        }
        #clover:active {
            transform: scale(0.9);
            animation: none; /* 点击时停止呼吸 */
        }
        
        /* 点击波纹效果 */
        .ripple {
            position: absolute;
            border: 4px solid var(--clover-green);
            border-radius: 50%;
            background: transparent;
            animation: rippleEffect 0.5s ease-out;
            pointer-events: none;
        }

        /* 飘字动画 */
        .plus-one {
            position: absolute;
            color: var(--text-gold);
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 0 0 5px rgba(255,215,0,0.7);
            animation: floatUp 0.7s ease-out forwards;
            pointer-events: none;
        }

        /* 关键帧动画 */
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.2); opacity: 0; }
        }
        @keyframes breathe {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.03); }
        }
        @keyframes rippleEffect {
            0% { width: 100px; height: 100px; opacity: 0.8; }
            100% { width: 250px; height: 250px; opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="stats-panel">
        <div class="total-count">累计总幸运值: <span id="totalDisplay">0</span></div>
        <div class="today-count" id="todayDisplay">0</div>
        <div class="today-count-label">今日幸运</div>
    </div>

    <div class="clover-container" onclick="collectLuck(event)">
        <div id="clover">🍀</div>
    </div>

    <script>
        const getTodayStr = () => new Date().toISOString().split('T')[0];
        let stats = JSON.parse(localStorage.getItem('clover_stats')) || {
            total: 0,
            daily: {}
        };
        const totalEl = document.getElementById('totalDisplay');
        const todayEl = document.getElementById('todayDisplay');

        function updateDisplay() {
            const today = getTodayStr();
            totalEl.innerText = stats.total || 0;
            todayEl.innerText = stats.daily[today] || 0;
        }

        function collectLuck(e) {
            const today = getTodayStr();
            
            // 1. 数据统计
            stats.total = (stats.total || 0) + 1;
            stats.daily[today] = (stats.daily[today] || 0) + 1;
            localStorage.setItem('clover_stats', JSON.stringify(stats));
            updateDisplay();
            
            // 2. 视觉反馈
            showEffects(e);
            if (navigator.vibrate) navigator.vibrate(40);
        }

        function showEffects(e) {
            const container = document.querySelector('.clover-container');
            const clover = document.getElementById('clover');
            
            // 飘字: 幸运值 +1
            const textEl = document.createElement('div');
            textEl.className = 'plus-one';
            textEl.innerText = '幸运值 +1';
            // 修正漂浮位置：出现在四叶草中心上方
            textEl.style.left = (window.innerWidth / 2 - 50) + 'px'; 
            textEl.style.top = (window.innerHeight / 2 - 80) + 'px';
            document.body.appendChild(textEl);
            setTimeout(() => textEl.remove(), 700);

            // 波纹效果
            const rippleEl = document.createElement('div');
            rippleEl.className = 'ripple';
            // 波纹出现在点击位置
            rippleEl.style.left = (e.clientX - 50) + 'px';
            rippleEl.style.top = (e.clientY - 50) + 'px';
            document.body.appendChild(rippleEl);
            setTimeout(() => rippleEl.remove(), 500);
        }

        updateDisplay();
    </script>
</body>
</html>
